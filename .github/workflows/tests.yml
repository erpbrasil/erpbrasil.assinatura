name: tests

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]

jobs:
  tests:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - {name: Python 3.9, python: '3.9', os: ubuntu}
          - {name: Python 3.10, python: '3.10', os: ubuntu}
          - {name: Python 3.11, python: '3.11', os: ubuntu}
          - {name: Python 3.12, python: '3.12', os: ubuntu}
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python ${{ matrix.python }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip setuptools pytest pytest-xdist pytest-cov
          python -m pip install .[test]
      - name: Test
        run: |
          pytest --cov --cov-report=xml --cov-branch --doctest-glob="docs/*.md"
      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v4
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          fail_ci_if_error: true
          verbose: true
  signxml:
    # Prova o codigo nas tres majors do signxml. O teto do requirements.txt
    # (signxml<4) continua valendo para quem instala o pacote; aqui o signxml
    # da matriz e instalado por cima, so para o CI.
    name: signxml ${{ matrix.signxml }} / Python ${{ matrix.python }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - {signxml: '3.2.2', extra: '"pyOpenSSL<24.3" "cryptography<44"', python: '3.9'}
          - {signxml: '3.2.2', extra: '"pyOpenSSL<24.3" "cryptography<44"', python: '3.12'}
          - {signxml: '4.5.1', extra: '', python: '3.9'}
          - {signxml: '4.5.1', extra: '', python: '3.12'}
          - {signxml: '5.1.0', extra: '"cryptography>=45"', python: '3.10'}
          - {signxml: '5.1.0', extra: '"cryptography>=45"', python: '3.12'}
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python ${{ matrix.python }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip setuptools pytest
          python -m pip install .[test]
          python -m pip install "signxml==${{ matrix.signxml }}" ${{ matrix.extra }}
          python -m pip list | grep -iE "^(signxml|cryptography|pyopenssl|lxml) "
      - name: Test
        run: |
          pytest --doctest-glob="docs/*.md"
  pre-commit:
    name: Pre-commit Hooks
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-python@v5
    - uses: pre-commit/action@v3.0.1
  check-package:
    name: Build & Inspect Package
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install build check-wheel-contents

      - name: Build the package
        run: |
          python -m build

      - name: Check wheel contents (ignore W002)
        run: |
          check-wheel-contents dist/*.whl --ignore W002
